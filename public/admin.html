<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryMatch AI — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07050b;--rose:#ff2a74;--rose-h:#ff4d8d;--rose-dim:rgba(255,42,116,0.08);--rose-border:rgba(255,42,116,0.25);
  --purple:#8a2be2;--accent:linear-gradient(135deg,var(--rose),var(--purple));--accent-h:linear-gradient(135deg,var(--rose-h),#a04ef6);
  --ink:#fff;--ink2:#c9c3d0;--ink3:#6b6375;--glass:rgba(16,12,24,0.65);--glass-border:rgba(255,255,255,0.06);
  --blur:blur(20px);--r-sm:8px;--r-md:14px;--r-xl:24px;--t:all .25s ease;--font-h:'Outfit',sans-serif;--font-b:'Inter',sans-serif;
}
body{background:var(--bg);background-image:radial-gradient(circle at 50% 0%,#170d24,#07050b 60%);color:var(--ink);font-family:var(--font-b);min-height:100vh;padding:24px}
.hide{display:none!important}
.wrap{max-width:920px;margin:0 auto}
h1{font-family:var(--font-h);font-size:22px;font-weight:900;letter-spacing:-1px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
h1 svg{width:20px;height:20px;fill:var(--rose)}
.sub{font-size:13px;color:var(--ink3);margin-bottom:24px}
.card{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--r-xl);backdrop-filter:var(--blur);padding:24px;margin-bottom:18px}
.card h2{font-family:var(--font-h);font-size:15px;font-weight:800;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.input{flex:1;min-width:200px;padding:12px 14px;background:rgba(255,255,255,0.04);border:1px solid var(--glass-border);border-radius:var(--r-md);color:var(--ink);font-family:var(--font-b);font-size:14px}
.input:focus{outline:none;border-color:var(--rose-border)}
.btn{padding:12px 20px;background:var(--accent);color:#fff;border:none;border-radius:var(--r-md);font-family:var(--font-h);font-size:13px;font-weight:800;cursor:pointer;transition:var(--t)}
.btn:hover{background:var(--accent-h)}
.btn.ghost{background:transparent;border:1px solid var(--glass-border);color:var(--ink2)}
.btn.ghost:hover{border-color:var(--rose-border);color:#fff}
.msg{font-size:13px;margin-top:12px;min-height:16px}
.msg.err{color:#ff6b8a}.msg.ok{color:#28c840}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink3);padding:8px 10px;border-bottom:1px solid var(--glass-border)}
td{padding:10px;border-bottom:1px solid var(--glass-border);color:var(--ink2)}
.code-chip{font-family:var(--font-h);font-weight:700;color:#fff}
.del{font-size:11px;color:#ff6b8a;background:rgba(255,42,116,0.08);border:1px solid var(--rose-border);padding:5px 10px;border-radius:6px;cursor:pointer}
.del:hover{background:rgba(255,42,116,0.18)}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.stat{flex:1;min-width:120px;background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--r-md);padding:16px;text-align:center}
.stat-n{font-family:var(--font-h);font-size:24px;font-weight:900;background:var(--accent);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-l{font-size:11px;color:var(--ink3);margin-top:2px}
.muted{color:var(--ink3);font-size:12px;text-align:center;padding:20px}
.gen-row{align-items:center}
</style>
</head>
<body>
<div class="wrap">
  <h1><svg viewBox="0 0 24 24"><path d="M12 1l3 6 6 .5-4.5 4 1.5 6L12 14l-6 3.5 1.5-6L3 7.5 9 7z"/></svg> Painel Admin</h1>
  <p class="sub">StoryMatch AI · gerenciamento de códigos de acesso</p>

  <!-- LOGIN -->
  <div id="login" class="card" style="max-width:420px">
    <h2>Entrar</h2>
    <div class="row">
      <input class="input" type="password" id="pwd" placeholder="Senha de admin">
      <button class="btn" id="login-btn">Entrar</button>
    </div>
    <div class="msg" id="login-msg"></div>
  </div>

  <!-- PAINEL -->
  <div id="panel" class="hide">
    <div class="stats">
      <div class="stat"><div class="stat-n" id="s-codes">0</div><div class="stat-l">códigos ativos</div></div>
      <div class="stat"><div class="stat-n" id="s-uses">0</div><div class="stat-l">gerações totais</div></div>
      <div class="stat"><div class="stat-n" id="s-logs">0</div><div class="stat-l">registros de uso</div></div>
    </div>

    <div class="card">
      <h2>Gerar / adicionar código</h2>
      <div class="row gen-row">
        <input class="input" type="text" id="new-code" placeholder="Digite ou gere um código (ex: RIZZ-PRO-2X7K)">
        <button class="btn ghost" id="rand-btn">🎲 Gerar aleatório</button>
        <button class="btn" id="add-btn">Adicionar</button>
      </div>
      <div class="msg" id="add-msg"></div>
    </div>

    <div class="card">
      <h2>Códigos ativos</h2>
      <table>
        <thead><tr><th>Código</th><th>Usos</th><th></th></tr></thead>
        <tbody id="codes-body"></tbody>
      </table>
      <div class="muted hide" id="no-codes">Nenhum código cadastrado ainda.</div>
    </div>

    <div class="card">
      <h2>Últimos usos</h2>
      <table>
        <thead><tr><th>Quando</th><th>Código</th><th>Tipo</th><th>Tom</th><th>Objetivo</th></tr></thead>
        <tbody id="logs-body"></tbody>
      </table>
      <div class="muted hide" id="no-logs">Nenhum uso registrado ainda.</div>
    </div>

    <button class="btn ghost" id="logout-btn">Sair</button>
  </div>
</div>

<script>
let pwd = sessionStorage.getItem('rizz_admin') || '';
const $ = s => document.querySelector(s);
function headers(){ return {'Content-Type':'application/json','x-admin-password':pwd}; }

async function load(){
  try{
    const r = await fetch('/api/admin/codes',{headers:headers()});
    if(!r.ok){
      const d = await r.json().catch(()=>({}));
      throw new Error(d.error||'Acesso negado');
    }
    const data = await r.json();
    render(data);
    $('#login').classList.add('hide'); $('#panel').classList.remove('hide');
    return true;
  }catch(e){
    $('#login-msg').className='msg err'; $('#login-msg').textContent = e.message;
    sessionStorage.removeItem('rizz_admin'); pwd='';
    $('#login').classList.remove('hide'); $('#panel').classList.add('hide');
    return false;
  }
}

function render(data){
  const codes = data.accessCodes||[], usage=data.usageCount||{}, logs=data.logs||[];
  $('#s-codes').textContent = codes.length;
  $('#s-uses').textContent = Object.values(usage).reduce((a,b)=>a+b,0);
  $('#s-logs').textContent = logs.length;

  const body=$('#codes-body');
  body.innerHTML = codes.map(c=>`<tr>
    <td><span class="code-chip">${esc(c)}</span></td>
    <td>${usage[c]||0}</td>
    <td style="text-align:right"><button class="del" data-code="${esc(c)}">Remover</button></td>
  </tr>`).join('');
  $('#no-codes').classList.toggle('hide', codes.length>0);
  body.querySelectorAll('.del').forEach(b=>b.addEventListener('click',()=>removeCode(b.dataset.code)));

  const lb=$('#logs-body');
  lb.innerHTML = logs.slice().reverse().slice(0,50).map(l=>`<tr>
    <td>${esc(l.timestamp||'')}</td><td>${esc(l.code||'')}</td><td>${esc(l.type||'')}</td>
    <td>${esc(l.tone||'')}</td><td>${esc(l.goal||'')}</td></tr>`).join('');
  $('#no-logs').classList.toggle('hide', logs.length>0);
}

$('#login-btn').addEventListener('click', async ()=>{
  pwd = $('#pwd').value; sessionStorage.setItem('rizz_admin', pwd);
  $('#login-msg').textContent='Entrando...'; $('#login-msg').className='msg';
  await load();
});
$('#pwd').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#login-btn').click(); });
$('#logout-btn').addEventListener('click', ()=>{ sessionStorage.removeItem('rizz_admin'); pwd=''; location.reload(); });

$('#rand-btn').addEventListener('click', ()=>{
  const part=()=>Math.random().toString(36).slice(2,6).toUpperCase();
  $('#new-code').value = `RIZZ-${part()}-${part()}`;
});

$('#add-btn').addEventListener('click', async ()=>{
  const code = $('#new-code').value.trim();
  const msg=$('#add-msg');
  if(!code){ msg.className='msg err'; msg.textContent='Digite um código.'; return; }
  const r = await fetch('/api/admin/codes',{method:'POST',headers:headers(),body:JSON.stringify({code})});
  const d = await r.json();
  if(r.ok){ msg.className='msg ok'; msg.textContent='Código adicionado!'; $('#new-code').value=''; load(); }
  else { msg.className='msg err'; msg.textContent = d.error||'Erro.'; }
});

async function removeCode(code){
  if(!confirm('Remover o código '+code+'? Quem usa ele perde o acesso.')) return;
  const r = await fetch('/api/admin/codes',{method:'DELETE',headers:headers(),body:JSON.stringify({code})});
  if(r.ok) load();
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

if(pwd) load();
</script>
</body>
</html>
